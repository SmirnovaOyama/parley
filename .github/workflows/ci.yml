name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags too: test/upgrade.test.ts starts the last release's server from its tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t parley:local .
      # The image Parley runs in on Cloudflare (cloudflare/Dockerfile), built on the one above.
      - run: docker build -f cloudflare/Dockerfile .

  # The Worker that runs Parley on Cloudflare (cloudflare/README.md): it type-checks, and wrangler
  # takes its config and bundles it, without deploying anything.
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --containers-rollout none --var PUBLIC_URL:https://chat.example.com --var R2_ACCOUNT_ID:0
