# docker compose up -d, then open http://localhost:8787. Settings come from .env next to this file
# (see .env.example); KEY_ENCRYPTION_SECRET is required.
# To update: docker compose pull && docker compose up -d
services:
  parley:
    # The newest release. Put a version in place of latest (like 0.1.0) to stay on it.
    image: ghcr.io/smirnovaoyama/parley:latest
    # To build from this folder's source instead, swap the image line above for this one and run
    # docker compose up -d --build.
    # build: .
    ports:
      - "8787:8787"
    environment:
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?Set KEY_ENCRYPTION_SECRET in .env (see the README)}
      VITE_APP_NAME: ${VITE_APP_NAME:-Parley}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOW_FAKE_IP: ${ALLOW_FAKE_IP:-}
    volumes:
      - parley-data:/data
    restart: unless-stopped

volumes:
  parley-data:
