# docker compose up -d, then open http://localhost:8787. Settings come from .env next to this file
# (see .env.example); KEY_ENCRYPTION_SECRET is required.
# To update: docker compose pull && docker compose up -d
services:
  parley:
    # The newest release. Put a version in place of latest (like 0.2.0) to stay on it.
    image: ghcr.io/smirnovaoyama/parley:latest
    # To build from this folder's source instead, swap the image line above for this one and run
    # docker compose up -d --build.
    # build: .
    ports:
      - "8787:8787"
    environment:
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?Set KEY_ENCRYPTION_SECRET in .env (see the README)}
      VITE_APP_NAME: ${VITE_APP_NAME:-Parley AI}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOW_FAKE_IP: ${ALLOW_FAKE_IP:-}
    volumes:
      - parley-data:/data
    restart: unless-stopped

  # Cloudflare Tunnel: Parley online through Cloudflare, with no port open on this machine. Make a
  # tunnel in Cloudflare's dashboard (Zero Trust, Networks, Tunnels), give its public hostname the
  # service http://parley:8787, put its token in .env as TUNNEL_TOKEN, and start it with
  # docker compose --profile tunnel up -d. Then change the ports line above to
  # "127.0.0.1:8787:8787", so the site can't be reached around Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - parley
    restart: unless-stopped

volumes:
  parley-data:
